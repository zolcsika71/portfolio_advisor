[project]
name = "portfolio-advisor"
version = "0.1.0"
description = "Portfolio selection and advisory application"
authors = [
    { name = "zolcsika71", email = "bushdoctor2008@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.poetry]
packages = [
    { include = "portfolio_advisor", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)"
]
